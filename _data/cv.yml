    Projects:
      - name: "AOOS — Autonomous Organization Operating System"
        summary: "Kahlo Group. Industrial research and technology development programme combining investigation of autonomous cognitive and multi-agent systems with the engineering of an enterprise software platform for autonomous organisations. The research dimension examines how heterogeneous autonomous software agents can communicate, coordinate tasks, share organisational knowledge, and make distributed decisions while remaining subject to explicit governance and human oversight; the product dimension translates these concepts into a platform for managing autonomous agents, organisational knowledge, permissions, workflows, policies, resources, and decision processes."
        start_date: 2023-01
        end_date: present
        highlights:
          - Multi-agent orchestration, autonomous cognitive systems, and agent communication protocols
          - Agent capability/role representation and organisational knowledge ontologies
          - Workflow and task orchestration; policy and permission enforcement
          - Agent memory and knowledge management
          - Auditability, decision traceability, real-time observability, and explainable agent behaviour
          - Human-in-the-loop supervision and human–autonomy teaming across heterogeneous agents and systems

