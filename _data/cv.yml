    Research Profile:
      - Computational researcher with an interdisciplinary background in Information Technology, Business Analytics, and software engineering. Current research focuses on coordination, communication, and distributed decision-making in heterogeneous autonomous systems operating under uncertainty.
      - Develops computational frameworks combining Multi-Agent Systems, Agent-Based Modelling, distributed artificial intelligence, experimental design, and software engineering — examining how autonomous software agents, robotic platforms, and human supervisors share mission information, allocate tasks, coordinate resources, and adapt when operational conditions change.
      - "Long-term research objective: generalizable frameworks for real-time mission communication, adaptive task execution, and collaborative autonomy in complex field environments."

